<!doctype html>
<html lang="ta">
<head>
  <meta charset="utf-8">
  <title>lms-pay</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Tamil:wght@400;500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    (function () {
      try {
        var theme = localStorage.getItem('aganox.lms.theme');
        if (theme === 'dark') {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
        var lang = localStorage.getItem('aganox.lms.lang');
        if (lang === 'en' || lang === 'ta') {
          document.documentElement.lang = lang;
        }
      } catch (e) {}
    })();
  </script>
</head>
<body class="gov-app">
  <app-root></app-root>
</body>
</html>
