name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/frontend/aganox-lms-web/package-lock.json

      - name: Build backend
        shell: pwsh
        run: ./scripts/build-backend.ps1 -Configuration Release -SkipPrereqCheck

      - name: Run tests
        shell: pwsh
        run: ./scripts/test.ps1 -Configuration Release -SkipPrereqCheck

      - name: Build frontend
        shell: pwsh
        run: ./scripts/build-frontend.ps1 -Configuration production -SkipPrereqCheck

  publish-smoke:
    runs-on: windows-latest
    needs: build-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/frontend/aganox-lms-web/package-lock.json

      - name: Publish server package (self-contained)
        shell: pwsh
        run: ./scripts/publish-server.ps1 -Configuration Release -SkipPrereqCheck

      - name: Verify publish output
        shell: pwsh
        run: |
          if (-not (Test-Path artifacts/publish/server-x64/Aganox.Lms.Api.exe)) {
            throw "Publish output missing Aganox.Lms.Api.exe"
          }
          if (-not (Test-Path artifacts/publish/server-x64/wwwroot/index.html)) {
            throw "Publish output missing SPA wwwroot"
          }
          if (-not (Test-Path artifacts/publish/server-x64/tools/Configure-Server.ps1)) {
            throw "Publish output missing installer tools"
          }
